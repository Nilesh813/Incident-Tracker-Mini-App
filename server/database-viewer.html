<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Viewer - Incident Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .card h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .card .number {
      font-size: 2.5em;
      font-weight: bold;
      color: #764ba2;
    }
    
    .breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .breakdown-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .breakdown-item-label {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 5px;
    }
    
    .breakdown-item-value {
      font-size: 1.8em;
      font-weight: bold;
      color: #764ba2;
    }
    
    .latest {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .latest h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.3em;
    }
    
    .incident-item {
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 15px;
      background: #f8f9fa;
      border-radius: 4px;
    }
    
    .incident-item-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    
    .incident-item-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      font-size: 0.85em;
      color: #666;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 600;
    }
    
    .badge-sev1 { background: #fee; color: #c33; }
    .badge-sev2 { background: #fef3cd; color: #856404; }
    .badge-sev3 { background: #fff3cd; color: #856404; }
    .badge-sev4 { background: #d1ecf1; color: #0c5460; }
    
    .badge-open { background: #f8d7da; color: #721c24; }
    .badge-mitigated { background: #fff3cd; color: #856404; }
    .badge-resolved { background: #d4edda; color: #155724; }
    
    .loading {
      text-align: center;
      color: white;
      font-size: 1.2em;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.8em; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Database Viewer</h1>
    
    <div id="content" class="loading">
      Loading data...
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('http://localhost:3000/debug/stats');
        const data = await response.json();
        
        const statusBadges = {
          'OPEN': 'badge-open',
          'MITIGATED': 'badge-mitigated',
          'RESOLVED': 'badge-resolved'
        };
        
        const severityBadges = {
          'SEV1': 'badge-sev1',
          'SEV2': 'badge-sev2',
          'SEV3': 'badge-sev3',
          'SEV4': 'badge-sev4'
        };
        
        let html = `
          <div class="grid">
            <div class="card">
              <h3>Total Incidents</h3>
              <div class="number">${data.total}</div>
            </div>
        `;
        
        // Status breakdown
        for (const [status, count] of Object.entries(data.statusBreakdown)) {
          html += `
            <div class="card">
              <h3>${status}</h3>
              <div class="number">${count}</div>
            </div>
          `;
        }
        
        html += `</div>`;
        
        // Severity breakdown
        html += `<div class="breakdown">`;
        for (const [severity, count] of Object.entries(data.severityBreakdown)) {
          html += `
            <div class="breakdown-item">
              <div class="breakdown-item-label">${severity}</div>
              <div class="breakdown-item-value">${count}</div>
            </div>
          `;
        }
        html += `</div>`;
        
        // Latest incidents
        html += `
          <div class="latest">
            <h2>Latest 5 Incidents</h2>
        `;
        
        data.latest5.forEach(incident => {
          const statusBadge = statusBadges[incident.status] || '';
          const severityBadge = severityBadges[incident.severity] || '';
          const createdDate = new Date(incident.createdAt).toLocaleString();
          
          html += `
            <div class="incident-item">
              <div class="incident-item-title">${incident.title}</div>
              <div class="incident-item-meta">
                <div><strong>Service:</strong> ${incident.service}</div>
                <div><strong>Owner:</strong> ${incident.owner || 'N/A'}</div>
                <div><strong>Created:</strong> ${createdDate}</div>
              </div>
              <div style="margin-top: 10px;">
                <span class="badge ${severityBadge}">${incident.severity}</span>
                <span class="badge ${statusBadge}">${incident.status}</span>
              </div>
            </div>
          `;
        });
        
        html += `</div>`;
        
        document.getElementById('content').innerHTML = html;
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div style="color: white; text-align: center;">
            <h3>Error loading data</h3>
            <p>${error.message}</p>
            <p>Make sure the backend server is running on port 3000</p>
          </div>
        `;
      }
    }
    
    // Load data on page load and refresh every 5 seconds
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
